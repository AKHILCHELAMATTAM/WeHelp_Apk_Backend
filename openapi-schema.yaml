        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyTarget'
          description: ''
    put:
      operationId: api_admin_targets_update
      description: Admin endpoint to view, edit, or delete a daily target.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyTargetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DailyTargetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DailyTargetRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyTarget'
          description: ''
    patch:
      operationId: api_admin_targets_partial_update
      description: Admin endpoint to view, edit, or delete a daily target.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDailyTargetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDailyTargetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDailyTargetRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyTarget'
          description: ''
    delete:
      operationId: api_admin_targets_destroy
      description: Admin endpoint to view, edit, or delete a daily target.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/admin/tracking/agents/{agent_id}/history/:
    get:
      operationId: api_admin_tracking_agents_history_list
      description: |-
        Admin endpoint to view historical breadcrumb path of an agent.
        Supports filtering by specific date (YYYY-MM-DD).
      parameters:
      - in: path
        name: agent_id
        schema:
          type: integer
        required: true
      - in: query
        name: date
        schema:
          type: string
        description: Filter history by date (YYYY-MM-DD)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
