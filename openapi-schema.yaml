components:
  schemas:
    ActionEnum:
      enum:
      - APPROVE
      - REJECT
      type: string
      description: |-
        * `APPROVE` - Approve Leave or Week-Off
        * `REJECT` - Reject Request
    AgentCreate:
      type: object
      description: |-
        Admin workflow:
        'Agent Creation' -> 'Create Agent Username and Password' -> 'Save Agent Account'
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        employee_id:
          type: string
          nullable: true
          description: Unique employee/agent code
          maxLength: 50
        assigned_area:
          type: string
          nullable: true
          description: Operational territory or assigned region
          maxLength: 150
        is_active_agent:
          type: boolean
          default: true
          description: Active status for field duty
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - username
    AgentCreateRequest:
      type: object
      description: |-
        Admin workflow:
        'Agent Creation' -> 'Create Agent Username and Password' -> 'Save Agent Account'
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 6
          description: Password to assign to the new agent
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        employee_id:
          type: string
          nullable: true
          description: Unique employee/agent code
          maxLength: 50
        assigned_area:
          type: string
          nullable: true
          description: Operational territory or assigned region
          maxLength: 150
        is_active_agent:
          type: boolean
          default: true
          description: Active status for field duty
      required:
      - password
      - username
    AgentDailyTargetProgress:
      type: object
      description: |-
        Workflow:
        'Attendance' -> 'Display Today's Target' -> 'View Daily Target'
        Combines target goals with real-time achieved metrics.
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
        target_cash_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Target cash donation amount to collect for the day
        target_donations_count:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Target number of successful donation entries for the day
        target_product_units:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Target quantity of products or grocery items to collect
        notes:
          type: string
          nullable: true
          description: Specific focus/instructions for today
        achieved_cash_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        achieved_donations_count:
          type: integer
          readOnly: true
        achieved_product_units:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        cash_completion_percentage:
          type: number
          format: double
          readOnly: true
        count_completion_percentage:
          type: number
          format: double
          readOnly: true
        is_cash_target_met:
          type: boolean
          readOnly: true
      required:
      - achieved_cash_amount
      - achieved_donations_count
      - achieved_product_units
      - cash_completion_percentage
      - count_completion_percentage
      - id
      - is_cash_target_met
    AgentDetail:
      type: object
      description: Admin management view for agent profiles.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
          description: |-
            User role in the system: Admin or Agent

            * `ADMIN` - Admin
            * `AGENT` - Agent
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        employee_id:
          type: string
          nullable: true
          description: Unique employee/agent code
          maxLength: 50
        assigned_area:
          type: string
          nullable: true
          description: Operational territory or assigned region
          maxLength: 150
        is_active_agent:
          type: boolean
          description: Specifies if agent is currently active for field duties
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        created_by:
          type: integer
          readOnly: true
          nullable: true
        created_by_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - created_by
      - created_by_name
      - id
      - last_login
      - role
      - updated_at
      - username
    AgentDetailRequest:
      type: object
      description: Admin management view for agent profiles.
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        employee_id:
          type: string
          nullable: true
          description: Unique employee/agent code
          maxLength: 50
        assigned_area:
          type: string
          nullable: true
          description: Operational territory or assigned region
          maxLength: 150
        is_active_agent:
          type: boolean
          description: Specifies if agent is currently active for field duties
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
      required:
      - username
    AgentLocation:
      type: object
      description: Detailed location serializer for viewing coordinates history.
      properties:
        id:
          type: integer
          readOnly: true
        agent_id:
          type: integer
          readOnly: true
        agent_username:
          type: string
          readOnly: true
        agent_name:
          type: string
          readOnly: true
        latitude:
          type: number
          format: double
          description: Latitude coordinate in decimal degrees
        longitude:
          type: number
          format: double
          description: Longitude coordinate in decimal degrees
        accuracy:
          type: number
          format: double
          nullable: true
          description: GPS accuracy in meters
        speed:
          type: number
          format: double
          nullable: true
          description: Current movement speed (km/h)
        altitude:
          type: number
          format: double
          nullable: true
          description: Altitude in meters
        battery_level:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
          description: Device battery percentage at time of capture (0-100)
        address:
          type: string
          nullable: true
          description: Human-readable address or landmark
          maxLength: 255
        recorded_at:
          type: string
          format: date-time
          description: Timestamp when GPS fix was recorded on device
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - agent_id
      - agent_name
      - agent_username
      - created_at
      - id
      - latitude
      - longitude
    AgentLocationSendRequest:
      type: object
      description: |-
        Used by Agent on Android App:
        'Send Location to Backend'
      properties:
        latitude:
          type: number
          format: double
          description: Latitude coordinate in decimal degrees
        longitude:
          type: number
          format: double
          description: Longitude coordinate in decimal degrees
        accuracy:
          type: number
          format: double
          nullable: true
          description: GPS accuracy in meters
        speed:
          type: number
          format: double
          nullable: true
          description: Current movement speed (km/h)
        altitude:
          type: number
          format: double
          nullable: true
          description: Altitude in meters
        battery_level:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
          description: Device battery percentage at time of capture (0-100)
        address:
          type: string
          nullable: true
