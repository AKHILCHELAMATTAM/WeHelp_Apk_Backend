        agent_id:
          type: integer
          readOnly: true
        agent_username:
          type: string
          readOnly: true
        agent_name:
          type: string
          readOnly: true
        date:
          type: string
          format: date
          readOnly: true
        check_in_time:
          type: string
          format: date-time
          nullable: true
        check_out_time:
          type: string
          format: date-time
          nullable: true
        check_in_latitude:
          type: number
          format: double
          nullable: true
        check_in_longitude:
          type: number
          format: double
          nullable: true
        check_in_address:
          type: string
          nullable: true
