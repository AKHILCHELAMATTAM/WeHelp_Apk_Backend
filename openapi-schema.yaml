      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAgentLocationList'
          description: ''
  /api/admin/tracking/live/:
    get:
      operationId: api_admin_tracking_live_list
      description: Returns latest GPS coordinates and status for all active field
        agents.
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LiveAgentTracking'
          description: ''
  /api/agent/attendance/check-in/:
    post:
      operationId: api_agent_attendance_check_in_create
      description: Records check-in timestamp and coordinates for today.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
          multipart/form-data:
            schema:
