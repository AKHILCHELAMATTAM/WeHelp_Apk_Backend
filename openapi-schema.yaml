  /api/agent/attendance/history/:
    get:
      operationId: api_agent_attendance_history_list
      description: Returns historical attendance records for the authenticated agent.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttendanceList'
          description: ''
  /api/agent/attendance/status/:
    get:
      operationId: api_agent_attendance_status_retrieve
      description: Returns today's attendance status for the authenticated agent.
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
                description: Unspecified response body
          description: ''
  /api/agent/dashboard/:
    get:
      operationId: api_agent_dashboard_retrieve
