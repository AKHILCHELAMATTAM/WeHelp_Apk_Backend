openapi: 3.0.3
info:
  title: Agent & Donation Management API
  version: 1.0.0
  description: Complete backend APIs for Android mobile application and Admin web
    dashboard. Supports Role-based login (Admin/Agent), Agent Account Creation, Live
    GPS Location Tracking, Cash & Product/Grocery Donation Logging, Payment Records
    Management, Attendance & Daily Targets, Leave/Week-off Requests and Approvals.
paths:
  /:
    get:
      operationId: root_retrieve
      description: Interactive catalog of all available API endpoints in the system.
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
                description: Unspecified response body
          description: ''
  /api/admin/agents/:
    get:
      operationId: api_admin_agents_list
      description: |-
        Admin workflow:
        'Agent Creation' -> 'Create Agent Username and Password' -> 'Save Agent Account'
        Also lists all agents with search & filtering.
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
        description: Filter by active status (true/false)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Search by name, username, employee ID, or assigned area
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAgentDetailList'
          description: ''
    post:
      operationId: api_admin_agents_create
      description: |-
        Admin workflow:
        'Agent Creation' -> 'Create Agent Username and Password' -> 'Save Agent Account'
        Also lists all agents with search & filtering.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCreate'
          description: ''
  /api/admin/agents/{id}/:
    get:
      operationId: api_admin_agents_retrieve
      description: Admin endpoint to retrieve, update, or remove an agent account.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetail'
          description: ''
    put:
      operationId: api_admin_agents_update
      description: Admin endpoint to retrieve, update, or remove an agent account.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentDetailRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetail'
          description: ''
    patch:
      operationId: api_admin_agents_partial_update
      description: Admin endpoint to retrieve, update, or remove an agent account.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAgentDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAgentDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAgentDetailRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetail'
          description: ''
    delete:
      operationId: api_admin_agents_destroy
      description: Admin endpoint to retrieve, update, or remove an agent account.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/admin/agents/{id}/toggle-status/:
    post:
      operationId: api_admin_agents_toggle_status_create
      description: Admin endpoint to toggle an agent account between active and deactivated
        status.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
                description: Unspecified response body
          description: ''
  /api/admin/attendance/:
    get:
      operationId: api_admin_attendance_list
      description: Admin endpoint to view and filter attendance records across all
        agents.
      parameters:
      - in: query
        name: agent_id
        schema:
          type: integer
        description: Filter by Agent ID
      - in: query
        name: date
        schema:
          type: string
        description: Filter by date (YYYY-MM-DD)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
        description: Filter by PRESENT, HALF_DAY, ABSENT
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttendanceList'
          description: ''
  /api/admin/dashboard/:
    get:
      operationId: api_admin_dashboard_retrieve
      description: Returns top-level overview metrics, online agents, pending leaves,
        and recent donations for Admin Dashboard.
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
                description: Unspecified response body
          description: ''
  /api/admin/donations/:
    get:
      operationId: api_admin_donations_list
      description: Admin endpoint to view and filter all donations.
      parameters:
      - in: query
        name: agent_id
        schema:
          type: integer
        description: Filter by Agent ID
      - in: query
        name: date
        schema:
          type: string
        description: Date filter (YYYY-MM-DD)
      - in: query
        name: donation_type
        schema:
          type: string
        description: CASH or PRODUCT
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Search receipt, donor, or product
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDonationDetailList'
          description: ''
  /api/admin/donations/{id}/:
    get:
      operationId: api_admin_donations_retrieve
      description: Admin endpoint to view, edit, or delete any donation record.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationDetail'
          description: ''
    put:
      operationId: api_admin_donations_update
      description: Admin endpoint to view, edit, or delete any donation record.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonationDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DonationDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DonationDetailRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationDetail'
          description: ''
    patch:
      operationId: api_admin_donations_partial_update
      description: Admin endpoint to view, edit, or delete any donation record.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDonationDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDonationDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDonationDetailRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationDetail'
          description: ''
    delete:
      operationId: api_admin_donations_destroy
      description: Admin endpoint to view, edit, or delete any donation record.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/admin/donations/{id}/verify/:
    post:
      operationId: api_admin_donations_verify_create
      description: Admin endpoint to verify a donation record.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationDetail'
          description: ''
  /api/admin/leaves/:
    get:
      operationId: api_admin_leaves_list
      description: |-
        Admin workflow:
        'Leave and Week-Off Management' -> 'View Agent Requests'
      parameters:
      - in: query
        name: agent_id
        schema:
          type: integer
        description: Filter by Agent ID
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: request_type
        schema:
          type: string
        description: LEAVE or WEEK_OFF
      - in: query
        name: status
        schema:
          type: string
        description: PENDING, APPROVED, REJECTED
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLeaveRequestDetailList'
          description: ''
  /api/admin/leaves/{id}/:
    get:
      operationId: api_admin_leaves_retrieve
      description: Admin endpoint to view a specific request in detail.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestDetail'
          description: ''
  /api/admin/leaves/{id}/review/:
    post:
      operationId: api_admin_leaves_review_create
      description: Approves or Rejects a pending agent leave/week-off request.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveRequestReviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LeaveRequestReviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LeaveRequestReviewRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestDetail'
          description: ''
  /api/admin/payments/records/:
    get:
      operationId: api_admin_payments_records_list
      description: |-
        Admin workflow:
        'Payment Details' -> 'View or Manage Payment Records'
        Lists cash payment transactions with payment modes and settlement status.
      parameters:
      - in: query
        name: agent_id
        schema:
          type: integer
        description: Filter by Agent ID
      - in: query
        name: date
        schema:
          type: string
        description: Filter by date (YYYY-MM-DD)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: payment_mode
        schema:
          type: string
        description: CASH, UPI, CARD, BANK_TRANSFER, CHEQUE
      - in: query
        name: payment_status
        schema:
          type: string
        description: COMPLETED, PENDING, FAILED, REFUNDED
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaymentRecordList'
          description: ''
  /api/admin/payments/records/{id}/:
    get:
      operationId: api_admin_payments_records_retrieve
      description: |-
        Admin workflow:
        'Manage Payment Records' - update settlement status or transaction reference.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRecord'
          description: ''
    put:
      operationId: api_admin_payments_records_update
      description: |-
        Admin workflow:
        'Manage Payment Records' - update settlement status or transaction reference.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentStatusUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentStatusUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentStatusUpdateRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatusUpdate'
          description: ''
    patch:
      operationId: api_admin_payments_records_partial_update
      description: |-
        Admin workflow:
        'Manage Payment Records' - update settlement status or transaction reference.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPaymentStatusUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPaymentStatusUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPaymentStatusUpdateRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatusUpdate'
          description: ''
  /api/admin/payments/summary/:
    get:
      operationId: api_admin_payments_summary_retrieve
      description: 'Admin financial summary: total revenue, payment mode breakdowns,
        today vs overall collections.'
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
                description: Unspecified response body
          description: ''
  /api/admin/targets/:
    get:
      operationId: api_admin_targets_list
      description: Admin endpoint to set or list daily targets for agents.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDailyTargetList'
          description: ''
    post:
      operationId: api_admin_targets_create
      description: Admin endpoint to set or list daily targets for agents.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyTargetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DailyTargetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DailyTargetRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyTarget'
          description: ''
  /api/admin/targets/{id}/:
    get:
      operationId: api_admin_targets_retrieve
      description: Admin endpoint to view, edit, or delete a daily target.
      parameters:
      - in: path
        name: id
        schema:
